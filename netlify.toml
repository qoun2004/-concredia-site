[build]
  command   = "pip install python-frontmatter markdown && node scripts/fetch-airtable.js && python3 scripts/build_posts.py"
  functions = "netlify/functions"
  publish   = "."

[build.environment]
  NODE_VERSION   = "18"
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options    = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/_data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
