[build]
  command   = "node scripts/fetch-airtable.js"
  functions = "netlify/functions"
  publish   = "."

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options    = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/_data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
