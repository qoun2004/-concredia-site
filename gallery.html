<div class="filter-bar" id="filter-bar">
  <span class="filter-label">篩選：</span>
  <button class="filter-btn active" data-f="all">全部</button>
  <!-- 系列按鈕由 JS 根據資料動態產生 -->
  <button class="filter-btn" data-f="available">有現貨</button>
  <span class="filter-count" id="count"></span>
</div>

<div id="product-grid"></div>

<!-- 燈箱 -->
<div id="lb">
  <button class="lb-close" onclick="closeLb()" title="關閉">✕</button>
  <div class="lb-left" id="lb-left">
    <div class="lb-main-img" id="lb-main-img"></div>
    <div class="lb-thumbs" id="lb-thumbs"></div>
  </div>
  <div class="lb-right" id="lb-right"></div>
</div>

<footer>
  <a href="index.html">Concredia<span>.</span>Lab</a>

</footer>

<script>
// ── 讀取 SSG 產生的 JSON（部署時由 scripts/fetch-airtable.js 產生）
let ALL = [];
let CURRENT_FILTER = 'all';

// 庫存文字
const STOCK_TEXT   = { available:'有現貨', order:'可預訂', sold:'已售出', unknown:'洽詢' };
const STOCK_BADGE  = { available:'sb-available', order:'sb-order', sold:'sb-sold', unknown:'sb-sold' };
const STOCK_DOT    = { available:'s-available',  order:'s-order',  sold:'s-sold', unknown:'' };

// ── 載入資料
async function loadData() {
  const grid = document.getElementById('product-grid');
  try {
    const res  = await fetch('/_data/products.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();

    if (json.error || !json.products?.length) {
      grid.innerHTML = `<div class="empty">
        <h3>作品資料載入中</h3>
        <p style="font-size:.85rem;margin-top:.5rem;">Airtable 資料同步後即會顯示</p>
      </div>`;
      return;
    }

    ALL = json.products;
    buildFilterBar(ALL);  // 根據資料動態產生系列按鈕
    render(ALL, CURRENT_FILTER);

  } catch(e) {
    console.error(e);
    grid.innerHTML = `<div class="empty"><h3>暫時無法載入</h3><p>${e.message}</p></div>`;
  }
}

// ── 動態產生篩選按鈕
function buildFilterBar(products) {
  const bar = document.getElementById('filter-bar');
  
  // 取得所有實際存在的系列（照固定順序）
  const ORDER = ['流構系列','標準系列','客製系列','畫作系列'];
  const existing = ORDER.filter(s => products.some(p => p.series === s));
  // 若有不在清單裡的系列也加進來
  products.forEach(p => {
    if (p.series && !ORDER.includes(p.series) && !existing.includes(p.series))
      existing.push(p.series);
  });

  // 移除舊的系列按鈕（保留「全部」和「有現貨」）
  bar.querySelectorAll('[data-series]').forEach(b => b.remove());

  // 在「全部」後面插入系列按鈕
  const allBtn    = bar.querySelector('[data-f="all"]');
  const stockBtn  = bar.querySelector('[data-f="available"]');
  
  existing.forEach(series => {
    const count = products.filter(p => p.series === series).length;
    const btn   = document.createElement('button');
    btn.className   = 'filter-btn';
    btn.dataset.f   = series;
    btn.dataset.series = series;
    btn.textContent = `${series}（${count}）`;
    btn.addEventListener('click', function(){
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      CURRENT_FILTER = this.dataset.f;
      render(ALL, CURRENT_FILTER);
    });
    bar.insertBefore(btn, stockBtn);
  });
  
  // 重新綁定所有按鈕事件
  bar.querySelectorAll('.filter-btn').forEach(btn => {
    if (btn.dataset.series) return; // 已綁定
    btn.addEventListener('click', function(){
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      CURRENT_FILTER = this.dataset.f;
      render(ALL, CURRENT_FILTER);
    });
  });
}

// ── 渲染 Grid
function render(products, filter) {
  const grid = document.getElementById('product-grid');
  let list = products;
  if (filter === 'available') list = products.filter(p => p.stockStatus === 'available');
  else if (filter !== 'all') list = products.filter(p => p.series === filter);

  document.getElementById('count').textContent = `${list.length} / ${products.length} 件`;

  if (!list.length) {
    grid.innerHTML = `<div class="empty"><h3>沒有符合的作品</h3></div>`;
    return;
  }

  grid.innerHTML = list.map(p => {
    const imgHTML = p.mainImg
      ? `<img src="${p.mainImg}" alt="${esc(p.name)}" loading="lazy" onload="this.classList.add('loaded')">`
      : `<div class="no-photo"><span>🧱</span><small>拍攝中</small></div>`;
    const dotClass = STOCK_DOT[p.stockStatus] || '';
    const dotHTML  = dotClass ? `<div class="stock-dot ${dotClass}" title="${STOCK_TEXT[p.stockStatus]}"></div>` : '';
    const tags     = [p.method, p.func].filter(Boolean).map(t => `<span class="card-tag">${esc(t)}</span>`).join('');
    return `
    <div class="product-card" onclick="openLb('${p.id}')">
      <div class="card-img-wrap">
        ${imgHTML}
        <div class="series-badge">${esc(p.series)}</div>
        ${dotHTML}
      </div>
      <div class="card-body">
        <div class="card-sku">${esc(p.sku)}</div>
        <div class="card-name">${esc(p.name)}</div>
        <div class="card-meta">${esc(p.material) || '—'}</div>
        ${tags ? `<div class="card-tags">${tags}</div>` : ''}
      </div>
      <div class="card-footer">
        <div class="card-spec">${esc(p.spec) || '規格洽詢'}</div>
        <button class="card-open">查看詳情 →</button>
      </div>
    </div>`;
  }).join('');
}

// ── 燈箱
function openLb(id) {
  const p = ALL.find(x => x.id === id);
  if (!p) return;

  // 主圖
  const mainWrap = document.getElementById('lb-main-img');
  if (p.images.length) {
    mainWrap.innerHTML = `<img id="lb-img" src="${p.mainImgFull || p.mainImg}" alt="${esc(p.name)}">`;
  } else {
    mainWrap.innerHTML = `<div class="lb-no-photo">🧱</div>`;
  }

  // 縮圖
  const thumbsWrap = document.getElementById('lb-thumbs');
  if (p.images.length > 1) {
    thumbsWrap.style.display = 'flex';
    thumbsWrap.innerHTML = p.images.map((img, i) =>
      `<img class="lb-thumb ${i===0?'active':''}" src="${img.thumb_sm}"
            onclick="switchImg('${img.thumb_xl||img.url}',this)" loading="lazy">`
    ).join('');
  } else {
    thumbsWrap.style.display = 'none';
  }

  // 右側資訊
  const stockBadge  = `<span class="stock-badge ${STOCK_BADGE[p.stockStatus]}">${STOCK_TEXT[p.stockStatus]}</span>`;
  const infoRows = (arr) => arr.filter(([,v])=>v).map(([k,v])=>
    `<div class="lb-row"><span class="lb-key">${k}</span><span class="lb-val">${esc(String(v))}</span></div>`
  ).join('');

  document.getElementById('lb-right').innerHTML = `
    <div class="lb-header">
      <div class="lb-series">${esc(p.series)}</div>
      <div class="lb-name">${esc(p.name)}</div>
      <div class="lb-sku">${esc(p.sku)}</div>
    </div>

    <div class="lb-section">
      <div class="lb-section-title">規格</div>
      ${infoRows([
        ['尺寸', p.spec],
        ['重量', p.weight ? p.weight + ' g' : ''],
        ['工法', p.method],
        ['材料', p.material],
      ])}
    </div>

    <div class="lb-section">
      <div class="lb-section-title">用途</div>
      ${infoRows([
        ['功能', p.func],
        ['適合', p.suitable],
        ['系列', p.series],
      ])}
    </div>

    <div class="lb-section">
      <div class="lb-section-title">庫存</div>
      <div style="padding:.5rem 0;">${stockBadge}</div>
    </div>

    <div class="lb-footer">
      <a class="lb-cta" href="contact.html?ref=${encodeURIComponent(p.sku)}">
        詢問這件作品 →
      </a>
    </div>`;

  document.getElementById('lb').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function switchImg(url, el) {
  const img = document.getElementById('lb-img');
  if (img) { img.style.opacity = '0'; img.src = url; img.onload = ()=>{ img.style.opacity='1'; }; }
  document.querySelectorAll('.lb-thumb').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

function closeLb() {
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow = '';
}

// ESC + 點背景關閉
document.addEventListener('keydown', e => { if(e.key==='Escape') closeLb(); });
document.getElementById('lb').addEventListener('click', function(e){
  if(e.target===this) closeLb();
});

// ── 篩選事件由 buildFilterBar() 動態綁定

// ── Nav scroll
window.addEventListener('scroll', () => {
  document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 60);
});

// ── XSS 防護
function esc(str) {
  return String(str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 啟動
loadData();
</script>
