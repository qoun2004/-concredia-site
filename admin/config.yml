backend:
  name: git-gateway
  branch: main

media_folder: "images/blog"
public_folder: "/images/blog"
locale: "zh_Hant"

collections:
  - name: "posts"
    label: "📝 最新動態文章"
    label_singular: "文章"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{category}} — {{date}}"
    fields:
      - { label: "文章標題", name: "title", widget: "string", hint: "顯示在文章頁和首頁列表" }
      - { label: "發布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: "分類"
        name: "category"
        widget: "select"
        options:
          - { label: "🛣️  寂寞公路計劃 — 戶外活動、作品帶出去的故事", value: "寂寞公路計劃" }
          - { label: "⚙️  Maker 實錄 — 製程、工法、技術紀錄", value: "Maker 實錄" }
          - { label: "🐾  倉庫日常 — 工作室日常、寶妹日記", value: "倉庫日常" }
          - { label: "🌱  社區行動 — 掃一張桌子、各地合作計畫", value: "社區行動" }
          - { label: "📣  媒體 & 活動 — 展覽、媒體報導、活動紀錄", value: "媒體 & 活動" }
      - { label: "封面圖片", name: "thumbnail", widget: "image", required: false, hint: "建議比例 16:9，會顯示在首頁列表和文章頂部" }
      - { label: "文章摘要", name: "excerpt", widget: "text", hint: "2-3 句話，顯示在首頁列表卡片上" }
      - label: "文章內容"
        name: "body"
        widget: "markdown"
        hint: "支援標題、粗體、圖片插入、YouTube 連結"
      - label: "YouTube 影片網址"
        name: "youtube"
        widget: "string"
        required: false
        hint: "例如 https://www.youtube.com/watch?v=XXXXX，會嵌入到文章底部"
      - label: "相關標籤"
        name: "tags"
        widget: "list"
        required: false
        hint: "用逗號分隔，例如：水泥音響, EAC, 廢料"
