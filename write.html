<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寫文章 · Concredia.Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #F5F3F0;
    --panel: #FFFFFF;
    --border: rgba(0,0,0,0.1);
    --border-focus: rgba(155,91,58,0.6);
    --fire: #C04A00;
    --fire-h: #E85D04;
    --text: #2A2420;
    --text-dim: #6B5E58;
    --text-hint: #9E8E88;
    --fd: 'Inter Tight', sans-serif;
    --fb: 'Noto Sans TC', sans-serif;
  }

  body {
    font-family: var(--fb);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.7;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 2.5rem;
    border-bottom: 1px solid rgba(0,0,0,0.08);
    background: rgba(245,243,240,0.97);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .logo {
    font-family: var(--fd);
    font-weight: 900;
    font-size: 1.1rem;
    letter-spacing: -0.04em;
    color: var(--text);
  }
  .logo span { color: var(--fire); }
  .header-tag {
    font-family: var(--fd);
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* ── LAYOUT ── */
  .container {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 0;
    max-width: 1200px;
    margin: 0 auto;
    padding: 2.5rem 2rem;
    gap: 2.5rem;
  }

  /* ── FORM SECTIONS ── */
  .section-label {
    font-family: var(--fd);
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--fire);
    margin-bottom: 0.6rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(155,91,58,0.25);
  }

  .field { margin-bottom: 1.75rem; }

  label {
    display: block;
    font-size: 0.84rem;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 0.5rem;
    letter-spacing: 0.04em;
  }
  label .req { color: var(--fire); margin-left: 2px; }
  label .hint {
    font-weight: 400;
    color: var(--text-hint);
    font-size: 0.76rem;
    margin-left: 0.5rem;
  }

  input[type="text"],
  input[type="date"],
  input[type="url"],
  select,
  textarea {
    width: 100%;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    color: var(--text);
    font-family: var(--fb);
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--border-focus);
    background: #FFF8F5;
  }
  select option { background: #1c1a17; }
  textarea { resize: vertical; line-height: 1.75; }

  /* ── TITLE INPUT (BIG) ── */
  #title {
    font-family: var(--fd);
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    padding: 1rem 1.25rem;
  }

  /* ── CONTENT EDITOR ── */
  .editor-wrap { position: relative; }
  #content {
    min-height: 400px;
    font-family: 'Noto Sans TC', monospace;
    font-size: 1rem;
    line-height: 1.9;
    padding: 1.25rem;
    tab-size: 2;
  }
  .editor-toolbar {
    display: flex;
    gap: 0.25rem;
    flex-wrap: wrap;
    padding: 0.6rem 0.75rem;
    background: #EDEBE8;
    border: 1px solid rgba(0,0,0,0.1);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
  }
  .editor-toolbar + textarea { border-radius: 0 0 6px 6px; }
  .tb-btn {
    background: none;
    border: 1px solid transparent;
    border-radius: 4px;
    color: var(--text-dim);
    font-size: 0.75rem;
    font-family: var(--fd);
    font-weight: 600;
    padding: 0.25rem 0.6rem;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }
  .tb-btn:hover {
    background: rgba(155,91,58,0.12);
    border-color: rgba(155,91,58,0.4);
    color: var(--fire-h);
  }
  .tb-sep {
    width: 1px;
    background: var(--border);
    margin: 0.1rem 0.25rem;
    align-self: stretch;
  }

  /* ── TAGS ── */
  .tag-input-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    padding: 0.6rem 0.75rem;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: text;
    min-height: 46px;
    align-items: center;
    transition: border-color 0.2s;
  }
  .tag-input-wrap:focus-within { border-color: var(--border-focus); }
  .tag-chip {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    background: rgba(155,91,58,0.15);
    border: 1px solid rgba(155,91,58,0.3);
    border-radius: 4px;
    padding: 0.15rem 0.5rem;
    font-size: 0.75rem;
    color: var(--fire-h);
    font-family: var(--fd);
  }
  .tag-chip button {
    background: none;
    border: none;
    color: rgba(155,91,58,0.6);
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1;
    padding: 0;
    transition: color 0.15s;
  }
  .tag-chip button:hover { color: var(--fire); }
  .tag-input {
    border: none !important;
    background: none !important;
    padding: 0.15rem 0.25rem !important;
    font-size: 0.85rem !important;
    flex: 1;
    min-width: 80px;
    width: auto !important;
    outline: none !important;
    border-radius: 0 !important;
  }

  /* ── PREVIEW PANEL ── */
  .sidebar { display: flex; flex-direction: column; gap: 1.5rem; }

  .panel {
    background: #FFFFFF;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 8px;
    overflow: hidden;
  }
  .panel-header {
    padding: 0.9rem 1.25rem;
    border-bottom: 1px solid var(--border);
    font-family: var(--fd);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .panel-body { padding: 1.25rem; }

  /* ── PREVIEW CARD ── */
  .preview-card {
    background: #F0EDE9;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 6px;
    overflow: hidden;
  }
  .preview-thumb {
    width: 100%;
    aspect-ratio: 16/9;
    background: rgba(155,91,58,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    color: rgba(155,91,58,0.4);
    overflow: hidden;
  }
  .preview-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .preview-card-body { padding: 0.85rem; }
  .preview-cat {
    font-family: var(--fd);
    font-size: 0.58rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--fire);
    font-weight: 700;
    margin-bottom: 0.4rem;
  }
  .preview-title {
    font-family: var(--fd);
    font-size: 0.95rem;
    font-weight: 700;
    color: #2A2420;
    line-height: 1.3;
    letter-spacing: -0.02em;
    margin-bottom: 0.4rem;
  }
  .preview-excerpt {
    font-size: 0.72rem;
    color: rgba(212,207,200,0.5);
    line-height: 1.6;
  }
  .preview-date {
    font-size: 0.65rem;
    color: #9E8E88;
    font-family: var(--fd);
    margin-top: 0.6rem;
  }

  /* ── FILENAME ── */
  .filename-box {
    background: #EDEBE8;
    border: 1px solid rgba(0,0,0,0.1);
    border-radius: 6px;
    padding: 0.75rem 1rem;
    font-family: monospace;
    font-size: 0.78rem;
    color: var(--fire-h);
    word-break: break-all;
    line-height: 1.5;
  }

  /* ── DOWNLOAD BTN ── */
  .btn-download {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    width: 100%;
    padding: 1rem;
    background: linear-gradient(135deg, var(--fire) 0%, var(--fire-h) 100%);
    border: none;
    border-radius: 6px;
    color: #fff;
    font-family: var(--fd);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
  }
  .btn-download:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-download:active { transform: translateY(0); }
  .btn-download:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ── STEPS ── */
  .steps { list-style: none; display: flex; flex-direction: column; gap: 0.75rem; }
  .steps li {
    display: flex;
    gap: 0.75rem;
    font-size: 0.84rem;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .step-num {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    background: rgba(155,91,58,0.15);
    border: 1px solid rgba(155,91,58,0.3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--fd);
    font-size: 0.62rem;
    font-weight: 700;
    color: var(--fire);
    margin-top: 1px;
  }
  .steps a {
    color: var(--fire-h);
    text-decoration: none;
  }
  .steps a:hover { text-decoration: underline; }

  /* ── SUCCESS TOAST ── */
  #toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1a3a1a;
    border: 1px solid rgba(39,174,96,0.4);
    color: #7ecb7e;
    padding: 0.85rem 1.5rem;
    border-radius: 8px;
    font-family: var(--fd);
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    opacity: 0;
    transition: all 0.3s cubic-bezier(.4,0,.2,1);
    z-index: 9999;
    white-space: nowrap;
  }
  #toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  @media (max-width: 900px) {
    .container { grid-template-columns: 1fr; }
    header { padding: 1rem 1.25rem; }
    .container { padding: 1.5rem 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Concredia<span>.</span>Lab</div>
  <div class="header-tag">✏️ 文章編輯器</div>
</header>

<div class="container">
  <!-- ── 左側編輯區 ── -->
  <div class="main-form">

    <div class="field">
      <div class="section-label">基本資訊</div>
      <label for="title">文章標題 <span class="req">*</span></label>
      <input type="text" id="title" placeholder="輸入文章標題…" oninput="updatePreview()">
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;" class="field">
      <div>
        <label for="date">發布日期 <span class="req">*</span></label>
        <input type="date" id="date" oninput="updatePreview()">
      </div>
      <div>
        <label for="category">分類 <span class="req">*</span></label>
        <select id="category" onchange="handleCatChange()">
          <option value="倉庫日常">🐾 倉庫日常</option>
          <option value="Maker 實錄">⚙️ Maker 實錄</option>
          <option value="寂寞公路計劃">🛣️ 寂寞公路計劃</option>
          <option value="社區行動">🌱 社區行動</option>
          <option value="媒體 & 活動">📣 媒體 & 活動</option>
          <option value="__new__">＋ 新增類別…</option>
        </select>
        <input type="text" id="new-category" placeholder="輸入新類別名稱" 
          style="display:none;margin-top:0.5rem;" 
          oninput="updatePreview()">
      </div>
    </div>

    <div class="field">
      <label for="excerpt">文章摘要 <span class="req">*</span> <span class="hint">2–3 句話，顯示在列表卡片</span></label>
      <textarea id="excerpt" rows="3" placeholder="簡短描述這篇文章的內容…" oninput="updatePreview()"></textarea>
    </div>

    <div class="field">
      <label for="thumbnail">封面圖片網址 <span class="hint">貼上圖片的 URL，或留空</span></label>
      <input type="url" id="thumbnail" placeholder="https://…" oninput="updatePreview()">
    </div>

    <div class="field">
      <div class="section-label">文章內容</div>
      <div class="editor-toolbar">
        <button class="tb-btn" onclick="wrap('**','**')" title="粗體"><b>B</b></button>
        <button class="tb-btn" onclick="wrap('*','*')" title="斜體"><i>I</i></button>
        <div class="tb-sep"></div>
        <button class="tb-btn" onclick="insertLine('## ')">H2</button>
        <button class="tb-btn" onclick="insertLine('### ')">H3</button>
        <div class="tb-sep"></div>
        <button class="tb-btn" onclick="insertLine('> ')">引言</button>
        <button class="tb-btn" onclick="insertLine('- ')">列表</button>
        <div class="tb-sep"></div>
        <button class="tb-btn" onclick="insertImg()">🖼 圖片</button>
        <button class="tb-btn" onclick="insertLine('---')">分隔線</button>
      </div>
      <textarea id="content" placeholder="在這裡寫文章內容（支援 Markdown 格式）…

## 大標題

這裡寫段落內容。

### 小標題

- 列表項目一
- 列表項目二

> 引言文字放這裡

![圖片說明](圖片網址)"></textarea>
    </div>

    <div class="field">
      <label for="youtube">YouTube 影片網址 <span class="hint">選填，會嵌入文章底部</span></label>
      <input type="url" id="youtube" placeholder="https://www.youtube.com/watch?v=…">
    </div>

    <div class="field">
      <label>標籤 <span class="hint">打完按 Enter 新增</span></label>
      <div class="tag-input-wrap" id="tag-wrap" onclick="document.getElementById('tag-input').focus()">
        <input type="text" id="tag-input" class="tag-input" placeholder="輸入標籤後按 Enter…" onkeydown="handleTag(event)">
      </div>
      <input type="hidden" id="tags-hidden">
    </div>

  </div>

  <!-- ── 右側側欄 ── -->
  <div class="sidebar">

    <!-- 預覽卡片 -->
    <div class="panel">
      <div class="panel-header">預覽卡片效果</div>
      <div class="panel-body">
        <div class="preview-card">
          <div class="preview-thumb" id="prev-thumb">🧱</div>
          <div class="preview-card-body">
            <div class="preview-cat" id="prev-cat">倉庫日常</div>
            <div class="preview-title" id="prev-title">文章標題</div>
            <div class="preview-excerpt" id="prev-excerpt">文章摘要會顯示在這裡…</div>
            <div class="preview-date" id="prev-date">—</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 檔名 -->
    <div class="panel">
      <div class="panel-header">產生的檔案名稱</div>
      <div class="panel-body">
        <div class="filename-box" id="filename-box">請先填寫標題和日期</div>
      </div>
    </div>

    <!-- 下載 -->
    <button class="btn-download" id="download-btn" onclick="downloadMd()" disabled>
      ⬇ 下載 .md 文章檔案
    </button>

    <!-- 上傳步驟 -->
    <div class="panel">
      <div class="panel-header">下載後怎麼發布？</div>
      <div class="panel-body">
        <ol class="steps">
          <li>
            <span class="step-num">1</span>
            按上方按鈕下載 <code style="color:var(--fire-h);font-size:0.75rem;">.md</code> 檔案
          </li>
          <li>
            <span class="step-num">2</span>
            前往 <a href="https://github.com/qoun2004/-concredia-site/upload/main/_posts" target="_blank">GitHub → _posts 資料夾</a>
          </li>
          <li>
            <span class="step-num">3</span>
            點 <strong style="color:var(--text)">Add file → Upload files</strong>，上傳剛才的 .md 檔案
          </li>
          <li>
            <span class="step-num">4</span>
            點 <strong style="color:var(--text)">Commit changes</strong>，Netlify 自動部署，約 1 分鐘後上線
          </li>
        </ol>
      </div>
    </div>

  </div>
</div>

<div id="toast">✅ 文章下載成功！</div>

<script>
  // ── 分類處理 ──
  function handleCatChange() {
    const sel = document.getElementById('category');
    const newInput = document.getElementById('new-category');
    if (sel.value === '__new__') {
      newInput.style.display = 'block';
      newInput.focus();
    } else {
      newInput.style.display = 'none';
    }
    updatePreview();
  }

  function getCategory() {
    const sel = document.getElementById('category');
    if (sel.value === '__new__') {
      return document.getElementById('new-category').value.trim() || '其他';
    }
    return sel.value;
  }

  // ── 初始化：設定今天日期 ──
  document.getElementById('date').value = new Date().toISOString().split('T')[0];
  updatePreview();

  // ── 即時預覽 ──
  function updatePreview() {
    const title    = document.getElementById('title').value || '文章標題';
    const excerpt  = document.getElementById('excerpt').value || '文章摘要會顯示在這裡…';
    const cat      = getCategory();
    const thumb    = document.getElementById('thumbnail').value;
    const dateVal  = document.getElementById('date').value;

    document.getElementById('prev-title').textContent   = title;
    document.getElementById('prev-excerpt').textContent = excerpt;
    document.getElementById('prev-cat').textContent     = cat;

    if (dateVal) {
      const d = new Date(dateVal);
      document.getElementById('prev-date').textContent =
        `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`;
    }

    const thumbEl = document.getElementById('prev-thumb');
    if (thumb) {
      thumbEl.innerHTML = `<img src="${thumb}" onerror="this.parentElement.innerHTML='🧱'">`;
    } else {
      thumbEl.innerHTML = '🧱';
    }

    // 更新檔名
    const slug = toSlug(title);
    const filename = dateVal && slug
      ? `${dateVal}-${slug}.md`
      : '請先填寫標題和日期';
    document.getElementById('filename-box').textContent = filename;

    // 開關下載按鈕
    const hasRequired = document.getElementById('title').value.trim() &&
                        document.getElementById('date').value &&
                        document.getElementById('excerpt').value.trim() &&
                        document.getElementById('content').value.trim();
    document.getElementById('download-btn').disabled = !hasRequired;
  }

  document.getElementById('title').addEventListener('input', updatePreview);
  document.getElementById('date').addEventListener('input', updatePreview);
  document.getElementById('excerpt').addEventListener('input', updatePreview);
  document.getElementById('content').addEventListener('input', updatePreview);
  document.getElementById('thumbnail').addEventListener('input', updatePreview);

  // ── slug 轉換 ──
  function toSlug(str) {
    return str.trim()
      .toLowerCase()
      .replace(/[\s\u3000]+/g, '-')
      .replace(/[^\w\u4e00-\u9fff\u3040-\u30ff-]/g, '')
      .replace(/-+/g, '-')
      .replace(/^-|-$/g, '')
      .slice(0, 60) || 'post';
  }

  // ── 標籤 ──
  const tags = [];
  function handleTag(e) {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      const val = e.target.value.trim().replace(/,/g, '');
      if (val && !tags.includes(val)) {
        tags.push(val);
        renderTags();
      }
      e.target.value = '';
    } else if (e.key === 'Backspace' && !e.target.value && tags.length) {
      tags.pop();
      renderTags();
    }
  }
  function removeTag(i) {
    tags.splice(i, 1);
    renderTags();
  }
  function renderTags() {
    const wrap = document.getElementById('tag-wrap');
    const input = document.getElementById('tag-input');
    wrap.innerHTML = '';
    tags.forEach((t, i) => {
      const chip = document.createElement('span');
      chip.className = 'tag-chip';
      chip.innerHTML = `${t}<button onclick="removeTag(${i})">×</button>`;
      wrap.appendChild(chip);
    });
    wrap.appendChild(input);
    document.getElementById('tags-hidden').value = tags.join(', ');
  }

  // ── 工具列 ──
  function wrap(before, after) {
    const ta = document.getElementById('content');
    const s = ta.selectionStart, e = ta.selectionEnd;
    const sel = ta.value.slice(s, e) || '文字';
    const newVal = ta.value.slice(0, s) + before + sel + after + ta.value.slice(e);
    ta.value = newVal;
    ta.focus();
    ta.setSelectionRange(s + before.length, s + before.length + sel.length);
    updatePreview();
  }
  function insertLine(prefix) {
    const ta = document.getElementById('content');
    const s = ta.selectionStart;
    const before = ta.value.slice(0, s);
    const after = ta.value.slice(s);
    const needNl = before.length && !before.endsWith('\n') ? '\n' : '';
    ta.value = before + needNl + prefix + after;
    const pos = before.length + needNl.length + prefix.length;
    ta.focus();
    ta.setSelectionRange(pos, pos);
    updatePreview();
  }
  function insertImg() {
    const url = prompt('請貼上圖片網址：');
    if (!url) return;
    const alt = prompt('圖片說明文字（可留空）：') || '圖片';
    insertLine(`![${alt}](${url})\n`);
  }

  // ── 下載 .md ──
  function downloadMd() {
    const title   = document.getElementById('title').value.trim();
    const date    = document.getElementById('date').value;
    const cat     = getCategory();
    const excerpt = document.getElementById('excerpt').value.trim();
    const thumb   = document.getElementById('thumbnail').value.trim();
    const content = document.getElementById('content').value.trim();
    const youtube = document.getElementById('youtube').value.trim();
    const tagList = tags;

    if (!title || !date || !excerpt || !content) {
      alert('請填寫：標題、日期、摘要、文章內容（這四項必填）');
      return;
    }

    let frontmatter = `---\ntitle: ${title}\ndate: ${date}\ncategory: ${cat}\n`;
    if (thumb) frontmatter += `thumbnail: ${thumb}\n`;
    frontmatter += `excerpt: ${excerpt}\n`;
    if (youtube) frontmatter += `youtube: ${youtube}\n`;
    if (tagList.length) frontmatter += `tags:\n${tagList.map(t => `  - ${t}`).join('\n')}\n`;
    frontmatter += `---\n\n`;

    const md = frontmatter + content;
    const slug = toSlug(title);
    const filename = `${date}-${slug}.md`;

    const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);

    // Toast
    const toast = document.getElementById('toast');
    toast.textContent = `✅ ${filename} 下載完成！`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }
</script>
