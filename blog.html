<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最新動態 — Concredia.Lab</title>
<meta name="description" content="Concredia.Lab 最新動態：寂寞公路計劃、永續日誌、倉庫日常、社區行動、媒體活動。">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<style>
/* ── Blog 專屬樣式 ── */
.blog-hero {
  padding: 9rem 6rem 5rem;
  background: var(--bk);
  border-bottom: 1px solid rgba(212,207,200,0.06);
}
.blog-hero-eye {
  font-family: var(--fd);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--fire);
  margin-bottom: 1.25rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.blog-hero-eye::before {
  content: '';
  width: 24px;
  height: 2px;
  background: var(--fire);
  flex-shrink: 0;
}
.blog-hero h1 {
  font-family: var(--fd);
  font-weight: 900;
  font-size: clamp(2.5rem, 5vw, 5rem);
  letter-spacing: -0.04em;
  color: var(--w);
  line-height: 0.95;
  margin-bottom: 1.5rem;
}
.blog-hero p {
  font-size: 1rem;
  color: rgba(212,207,200,0.55);
  max-width: 560px;
  line-height: 1.75;
  font-weight: 300;
}

/* 文章主體區 */
.blog-main {
  background: var(--w);
  min-height: 60vh;
  padding: 5rem 6rem;
}

/* 文章 Grid */
.blog-grid-all {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  border-top: 2px solid var(--bk);
}

/* 文章卡片 */
.article-card {
  display: flex;
  flex-direction: column;
  text-decoration: none;
  color: inherit;
  border-right: 1px solid var(--g200);
  border-bottom: 1px solid var(--g200);
  transition: background 0.2s;
}
.article-card:nth-child(3n) { border-right: none; }
.article-card:hover { background: var(--g50); }

.article-thumb {
  width: 100%;
  aspect-ratio: 16/10;
  overflow: hidden;
  background: var(--g100);
  flex-shrink: 0;
}
.article-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.5s ease;
}
.article-card:hover .article-thumb img { transform: scale(1.04); }

/* 圖片佔位（無圖時）*/
.article-thumb-placeholder {
  width: 100%;
  aspect-ratio: 16/10;
  background: var(--g100);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  color: var(--g200);
  flex-shrink: 0;
}

.article-body {
  padding: 1.75rem;
  display: flex;
  flex-direction: column;
  flex: 1;
}
.article-cat {
  font-family: var(--fd);
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--fire);
  margin-bottom: 0.6rem;
}
.article-title {
  font-family: var(--fd);
  font-weight: 900;
  font-size: 1.05rem;
  letter-spacing: -0.02em;
  color: var(--bk);
  line-height: 1.25;
  margin-bottom: 0.6rem;
}
.article-card:hover .article-title { color: var(--fire); }
.article-excerpt {
  font-size: 0.82rem;
  color: var(--g400);
  line-height: 1.7;
  flex: 1;
  margin-bottom: 1.25rem;
}
.article-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.68rem;
  color: var(--g400);
  font-family: var(--fd);
  border-top: 1px solid var(--g200);
  padding-top: 0.85rem;
  margin-top: auto;
}
.article-read {
  color: var(--fire);
  font-weight: 700;
  letter-spacing: 0.06em;
  transition: color 0.2s;
}

/* 空狀態 */
.no-results {
  grid-column: 1 / -1;
  padding: 5rem;
  text-align: center;
  color: var(--g400);
  font-size: 0.95rem;
}

/* Footer */
.blog-footer {
  background: var(--bk);
  padding: 3rem 6rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.f-logo {
  font-family: var(--fd);
  font-size: 1.1rem;
  font-weight: 900;
  color: rgba(212,207,200,0.85);
  letter-spacing: -0.03em;
}
.f-logo span { color: var(--fire); }
.f-note {
  font-size: 0.72rem;
  color: rgba(212,207,200,0.3);
}

/* RWD */
@media (max-width: 1024px) {
  .blog-hero { padding: 7rem 4rem 4rem; }
  .blog-main { padding: 4rem; }
  .blog-grid-all { grid-template-columns: repeat(2, 1fr); }
  .article-card:nth-child(3n) { border-right: 1px solid var(--g200); }
  .article-card:nth-child(2n) { border-right: none; }
}
@media (max-width: 768px) {
  .blog-hero { padding: 6rem 1.5rem 3rem; }
  .blog-main { padding: 2rem 1.5rem; }
  .blog-grid-all { grid-template-columns: 1fr; }
  .article-card { border-right: none; }
  .blog-footer { flex-direction: column; gap: 1rem; text-align: center; padding: 2.5rem 1.5rem; }
}
</style>
</head>
<body>

<nav id="mainNav">
  <a href="index.html" class="nav-logo">Concredia<span class="dot">.</span><span class="lab">Lab</span></a>
  <ul class="nav-links">
    <li><a href="story.html">品牌故事</a></li>
    <li><a href="products.html">產品系列</a></li>
    <li><a href="gifts.html" style="color:var(--fire-h);">🎁 節慶禮品</a></li>
    <li><a href="gallery.html">作品集</a></li>
    <li><a href="sustainability.html">永續 · ESG</a></li>
    <li><a href="blog.html">最新動態</a></li>
    <li><a href="contact.html">聯絡</a></li>
  </ul>
  <a href="fundraise.html" class="nav-fundraise">募資計畫 →</a>
  <button class="hamburger" id="hamburger" aria-label="選單">
    <span></span><span></span><span></span>
  </button>
</nav>

<!-- Hero -->
<div class="blog-hero">
  <div class="blog-hero-eye">最新動態</div>
  <h1>永續日誌<br>公路現場<br>倉庫日常</h1>
  <p>從工作室的深夜水磨，到旭海沙灘上的70公斤邂逅，記錄每一件作品背後的真實過程。</p>
</div>

<!-- 分類 Filter -->
<div class="filter-bar">
  <button class="filter-btn active" onclick="filterCat('all', this)">全部</button>
  <button class="filter-btn" onclick="filterCat('寂寞公路計劃', this)">🛣️ 寂寞公路計劃</button>
  <button class="filter-btn" onclick="filterCat('永續日誌', this)">⚙️ 永續日誌</button>
  <button class="filter-btn" onclick="filterCat('倉庫日常', this)">🐾 倉庫日常</button>
  <button class="filter-btn" onclick="filterCat('社區行動', this)">🌱 社區行動</button>
  <button class="filter-btn" onclick="filterCat('媒體 & 活動', this)">📣 媒體 & 活動</button>
</div>

<!-- 文章列表 -->
<div class="blog-main">
  <div class="blog-grid-all" id="articleGrid">

    <a href="blog-example.html" class="article-card" data-cat="倉庫日常">
      <div class="article-thumb">
        <img src="images/baomei.jpg" alt="這是一篇範例文章（可以刪掉）" loading="lazy">
      </div>
      <div class="article-body">
        <div class="article-cat">倉庫日常</div>
        <div class="article-title">這是一篇範例文章（可以刪掉）</div>
        <div class="article-excerpt">這是文章摘要，大約 2-3 句話，會顯示在首頁列表卡片上。</div>
        <div class="article-meta">
          <span>2025 年 4 月</span>
          <span class="article-read">閱讀全文 →</span>
        </div>
      </div>
    </a>

    <!-- 新文章加在這裡 -->

  </div>
</div>

<footer>
  <div class="f-logo">Concredia<span>.</span>Lab</div>
  <div class="f-note">© 2025 Concredia.Lab · 士敏文品工作室</div>
</footer>

<script>
window.addEventListener('scroll', function(){
  document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 60);
});

function filterCat(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  var cards = document.querySelectorAll('.article-card');
  var visible = 0;
  cards.forEach(function(card) {
    if (cat === 'all' || card.dataset.cat === cat) {
      card.style.display = '';
      visible++;
    } else {
      card.style.display = 'none';
    }
  });
  var noResults = document.getElementById('noResults');
  if (visible === 0) {
    if (!noResults) {
      var div = document.createElement('div');
      div.id = 'noResults';
      div.className = 'no-results';
      div.textContent = '這個分類還沒有文章，敬請期待。';
      document.getElementById('articleGrid').appendChild(div);
    }
  } else {
    if (noResults) noResults.remove();
  }
}
</script>
</body>
</html>
